<header class="barra">
  <div class="marca">
    <span class="logotipo">Cartera</span>
    <span class="separador" aria-hidden="true"></span>
    <span class="rotulo">Interactive Brokers</span>
  </div>

  <div class="estado">
    @if (sesion(); as s) {
      @if (s.connected) {
        <span class="pulso" aria-hidden="true"></span>
        <span class="rotulo">En vivo</span>
        @if (cuentaActiva(); as cuenta) {
          <span class="cuenta cifra">{{ cuenta }}</span>
        }
      } @else {
        <span class="pulso apagado" aria-hidden="true"></span>
        <span class="rotulo">Sin sesión</span>
      }
    } @else {
      <span class="pulso apagado" aria-hidden="true"></span>
      <span class="rotulo">Backend no localizado</span>
    }
  </div>
</header>

<main class="lienzo">
  <router-outlet />
</main>
